services:
  web:
    # Reemplazar <tu-usuario-github> por el usuario/organización real de GitHub.
    image: ghcr.io/<tu-usuario-github>/lee-tu-manga:latest
    restart: unless-stopped
    ports:
      # Publicado en todas las interfaces: accesible por Cloudflare Tunnel
      # (http://localhost:${APP_PORT}) y también directo por la IP local
      # del servidor en la LAN (http://<ip-lan>:${APP_PORT}).
      - "${APP_PORT:-3050}:80"
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      MANGA_LIBRARY_PATH: /mangas
      OWNER_USERNAME: ${OWNER_USERNAME}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      SOLID_QUEUE_IN_PUMA: "1"
    volumes:
      - ./mangas:/mangas:ro
      - ./storage:/rails/storage
